<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173e35" />
    <title>木拾光 · DIY 木珠搭配</title>
    <style>:root {
  --ink: #172b25;
  --muted: #79837e;
  --green: #1f5a4d;
  --green-dark: #173e35;
  --green-soft: #e7f0ec;
  --paper: #f6f4ef;
  --surface: #fffdf9;
  --line: #dfe5e1;
  --danger: #a64f35;
  --gold: #c49a59;
  --shadow: 0 18px 50px rgba(24, 51, 44, 0.1);
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 7% 4%, rgba(93, 151, 129, 0.12), transparent 24rem),
    linear-gradient(180deg, #e9eee9 0%, var(--paper) 26rem, var(--paper) 100%);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.46;
}

.app-shell {
  min-height: 100vh;
  padding-bottom: 92px;
}

.topbar {
  position: sticky;
  z-index: 30;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 76px;
  padding: 13px 20px;
  border-bottom: 1px solid rgba(31, 90, 77, 0.08);
  background: rgba(246, 244, 239, 0.9);
  backdrop-filter: blur(18px);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-mark {
  display: grid;
  width: 44px;
  height: 44px;
  place-items: center;
  color: #f2d29b;
  border-radius: 14px;
  background: var(--green-dark);
  font-family: "STSong", "Songti SC", serif;
  font-size: 24px;
  font-weight: 700;
}

.brand-name {
  font-size: 21px;
  font-weight: 800;
  letter-spacing: 0.14em;
}

.brand-sub {
  margin-top: 2px;
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.12em;
}

.top-action {
  padding: 10px 14px;
  color: var(--green);
  border: 1px solid rgba(31, 90, 77, 0.18);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
  font-size: 13px;
  font-weight: 700;
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 7px;
}

.page {
  width: min(1180px, 100%);
  margin: 0 auto;
  padding: 24px 20px 48px;
}

.desktop-nav {
  display: none;
}

.mobile-nav {
  position: fixed;
  z-index: 50;
  right: 0;
  bottom: 0;
  left: 0;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 9px 12px calc(9px + env(safe-area-inset-bottom));
  border-top: 1px solid rgba(31, 90, 77, 0.09);
  background: rgba(255, 253, 249, 0.96);
  box-shadow: 0 -12px 34px rgba(24, 51, 44, 0.08);
  backdrop-filter: blur(18px);
}

.nav-button {
  display: flex;
  min-height: 52px;
  align-items: center;
  justify-content: center;
  gap: 7px;
  color: #7d8681;
  border: 0;
  border-radius: 14px;
  background: transparent;
  font-size: 13px;
}

.nav-button.active {
  color: var(--green);
  background: var(--green-soft);
  font-weight: 800;
}

.nav-icon {
  display: grid;
  width: 24px;
  height: 24px;
  place-items: center;
  border: 1px solid currentColor;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 800;
}

.section-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin: 34px 0 18px;
}

.section-title {
  margin: 0;
  color: #1c372f;
  font-size: 28px;
  letter-spacing: 0.02em;
}

.section-note {
  color: var(--muted);
  font-size: 12px;
}

.inspiration-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
}

.inspiration-tabs::-webkit-scrollbar {
  display: none;
}

.inspiration-tabs button {
  flex: 0 0 auto;
  padding: 8px 11px;
  color: #69736e;
  border: 1px solid #dfe4e1;
  border-radius: 999px;
  background: #fff;
  font-size: 10px;
}

.inspiration-tabs button.active {
  color: #fff;
  border-color: var(--green);
  background: var(--green);
  font-weight: 800;
}

.surface {
  border: 1px solid rgba(36, 73, 62, 0.1);
  border-radius: 22px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.primary-button,
.secondary-button,
.ghost-button {
  display: inline-flex;
  min-height: 48px;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 0 22px;
  border-radius: 15px;
  font-weight: 800;
}

.primary-button {
  color: #fff;
  border: 1px solid var(--green-dark);
  background: var(--green-dark);
  box-shadow: 0 12px 25px rgba(23, 62, 53, 0.18);
}

.secondary-button {
  color: var(--green);
  border: 1px solid #bdd0c7;
  background: var(--green-soft);
}

.ghost-button {
  color: #56615c;
  border: 1px solid var(--line);
  background: #fff;
}

.icon-button {
  display: inline-grid;
  width: 42px;
  height: 42px;
  place-items: center;
  color: var(--green);
  border: 1px solid #d8e0dc;
  border-radius: 13px;
  background: #fff;
  font-size: 20px;
}

.hero {
  position: relative;
  display: grid;
  min-height: 570px;
  overflow: hidden;
  padding: 40px 28px 26px;
  border-radius: 30px;
  background:
    radial-gradient(circle at 78% 18%, rgba(164, 205, 184, 0.27), transparent 28rem),
    linear-gradient(145deg, #143a31, #23594b 64%, #17382f);
}

.hero::after {
  position: absolute;
  right: -140px;
  bottom: -170px;
  width: 460px;
  height: 460px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 50%;
  content: "";
}

.hero-copy {
  position: relative;
  z-index: 2;
  align-self: start;
}

.eyebrow {
  color: #b7d4c7;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.2em;
}

.hero h1 {
  max-width: 540px;
  margin: 16px 0 0;
  color: #fff;
  font-family: "STSong", "Songti SC", serif;
  font-size: clamp(38px, 7vw, 62px);
  font-weight: 700;
  line-height: 1.16;
}

.hero p {
  max-width: 510px;
  margin: 18px 0 0;
  color: rgba(255, 255, 255, 0.7);
  font-size: 15px;
  line-height: 1.8;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 26px;
}

.hero .primary-button {
  color: #173e35;
  border-color: #f2d29b;
  background: #f2d29b;
  box-shadow: none;
}

.hero .ghost-button {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.24);
  background: rgba(255, 255, 255, 0.08);
}

.hero-visual {
  position: relative;
  z-index: 2;
  width: min(390px, 88vw);
  aspect-ratio: 1;
  align-self: end;
  justify-self: center;
  margin: 28px auto -8px;
}

.wood-board {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  border: 10px solid rgba(201, 169, 112, 0.72);
  border-radius: 50%;
  background-color: #3f2b21;
  background-image: var(--board-texture);
  background-position: center;
  background-size: cover;
  box-shadow: inset 0 20px 55px rgba(0, 0, 0, 0.42), 0 25px 60px rgba(0, 0, 0, 0.25);
}

.board-ring {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 70%;
  height: 64%;
  border: var(--cord-width, 1px) solid var(--cord-color, rgba(255, 240, 213, 0.36));
  border-radius: 50%;
  transform: translate(-50%, -50%);
}

.board-logo {
  position: absolute;
  top: 50%;
  left: 50%;
  color: rgba(255, 244, 221, 0.2);
  font-family: "STSong", "Songti SC", serif;
  font-size: 18px;
  letter-spacing: 0.18em;
  white-space: nowrap;
  transform: translate(-50%, -50%);
}

.bead {
  position: absolute;
  z-index: 3;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 50%;
  box-shadow:
    0 7px 12px rgba(0, 0, 0, 0.46),
    inset -5px -7px 11px rgba(0, 0, 0, 0.28),
    inset 3px 4px 8px rgba(255, 255, 255, 0.16);
  filter: contrast(1.07) saturate(1.05);
  transition: transform 0.16s ease;
}

.bead:hover {
  transform: scale(1.08);
}

.bead::after {
  position: absolute;
  top: 14%;
  left: 18%;
  width: 29%;
  height: 22%;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.63);
  filter: blur(2px);
  content: "";
}

.bead.square {
  border-radius: 12px;
}

.bead.hex {
  border-radius: 15px;
  transform: rotate(18deg);
}

.feature-grid,
.template-grid,
.knowledge-grid,
.order-grid,
.stats-grid {
  display: grid;
  gap: 16px;
}

.feature-grid {
  grid-template-columns: 1fr;
}

.feature-card {
  padding: 22px;
}

.feature-icon {
  display: grid;
  width: 46px;
  height: 46px;
  place-items: center;
  color: var(--green);
  border-radius: 14px;
  background: var(--green-soft);
  font-weight: 800;
}

.feature-card h3 {
  margin: 16px 0 7px;
  font-size: 18px;
}

.feature-card p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.7;
}

.template-card {
  overflow: hidden;
  padding: 20px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.template-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 22px 54px rgba(24, 51, 44, 0.14);
}

.template-preview {
  position: relative;
  width: min(280px, 100%);
  aspect-ratio: 1;
  margin: 0 auto 18px;
}

.template-card h3 {
  margin: 0;
  font-size: 20px;
}

.template-card p {
  min-height: 44px;
  margin: 8px 0 14px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.65;
}

.package-grid {
  display: grid;
  gap: 16px;
}

.package-card {
  min-width: 0;
  padding: 18px;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.package-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 22px 54px rgba(24, 51, 44, 0.14);
}

.package-topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: var(--muted);
  font-size: 11px;
}

.package-audience {
  padding: 6px 9px;
  color: var(--green);
  border-radius: 999px;
  background: var(--green-soft);
  font-weight: 800;
}

.package-preview {
  position: relative;
  width: min(240px, 90%);
  aspect-ratio: 1;
  margin: 12px auto;
}

.package-card h3 {
  margin: 0;
  font-size: 18px;
}

.package-card p {
  min-height: 42px;
  margin: 7px 0 12px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.65;
}

.package-detail-hero {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 22px;
  padding: 28px;
  border-radius: 26px;
  background:
    radial-gradient(circle at 88% 12%, rgba(190, 218, 201, 0.25), transparent 18rem),
    linear-gradient(145deg, #173e35, #245b4e);
}

.package-detail-hero h2 {
  margin: 13px 0 0;
  color: #fff;
  font-family: "STSong", "Songti SC", serif;
  font-size: 31px;
}

.package-detail-hero p {
  max-width: 700px;
  margin: 12px 0 0;
  color: rgba(255, 255, 255, 0.7);
  font-size: 13px;
  line-height: 1.75;
}

.benefit-list {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 16px;
}

.benefit-list span {
  padding: 7px 10px;
  color: #dcebe4;
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.07);
  font-size: 10px;
}

.package-detail-price {
  min-width: 150px;
  align-self: center;
  padding: 18px;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.08);
  text-align: right;
}

.package-detail-price span,
.package-detail-price small {
  display: block;
  color: rgba(255, 255, 255, 0.62);
  font-size: 10px;
}

.package-detail-price strong {
  display: block;
  margin: 7px 0;
  color: #f2d29b;
  font-size: 30px;
}

.tier-grid {
  display: grid;
  gap: 14px;
}

.tier-card {
  padding: 19px;
  border-width: 2px;
  cursor: pointer;
}

.tier-card.active {
  border-color: #6f9e88;
  box-shadow: 0 15px 38px rgba(31, 90, 77, 0.14);
}

.tier-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.tier-head span {
  color: var(--green);
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.tier-head h3 {
  margin: 4px 0 0;
  font-size: 19px;
}

.tier-head > strong {
  font-size: 23px;
}

.tier-card > p {
  min-height: 42px;
  margin: 11px 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.65;
}

.tier-materials {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}

.tier-materials span {
  padding: 5px 8px;
  color: #4d6057;
  border-radius: 999px;
  background: #edf2ee;
  font-size: 9px;
}

.tier-card ul {
  margin: 13px 0 0;
  padding-left: 18px;
  color: #5f6b65;
  font-size: 11px;
  line-height: 1.75;
}

.tier-foot {
  margin-top: 13px;
  padding-top: 12px;
  color: #8b938f;
  border-top: 1px solid #eceeea;
  font-size: 10px;
}

.package-preview-pair {
  display: grid;
  grid-template-columns: 1fr;
  gap: 15px;
}

.package-preview-card {
  padding: 18px;
}

.package-preview-label,
.combo-preview-label {
  color: var(--green);
  font-size: 11px;
  font-weight: 800;
  text-align: center;
}

.package-large-preview {
  position: relative;
  width: min(390px, 100%);
  aspect-ratio: 1.04;
  margin: 8px auto;
}

.package-preview-meta {
  color: var(--muted);
  font-size: 11px;
  text-align: center;
}

.package-options {
  margin-top: 18px;
  padding: 22px;
}

.package-options h3 {
  margin: 0;
  font-size: 20px;
}

.package-options > p {
  margin: 8px 0 4px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
}

.package-feature-note {
  margin-top: 16px;
  padding: 13px 14px;
  border-left: 4px solid #b98c4e;
  border-radius: 0 12px 12px 0;
  background: #f6f0e4;
}

.package-feature-note strong {
  display: block;
  color: #6d4e25;
  font-size: 12px;
}

.package-feature-note span {
  display: block;
  margin-top: 5px;
  color: #8b714d;
  font-size: 10px;
  line-height: 1.6;
}

.quantity-table {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 7px;
  margin-top: 16px;
}

.quantity-table > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 11px;
  border-radius: 11px;
  background: #f0f3ef;
  font-size: 10px;
}

.quantity-table strong {
  color: var(--green);
}

.corporate-flow {
  margin: 16px 0 0;
  padding-left: 20px;
  color: #5d6963;
  font-size: 11px;
  line-height: 1.8;
}

.combo-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 18px 0;
}

.combo-summary > div {
  padding: 12px;
  border-radius: 12px;
  background: #f1f4f0;
}

.combo-summary span {
  display: block;
  color: var(--muted);
  font-size: 9px;
}

.combo-summary strong {
  display: block;
  margin-top: 5px;
  font-size: 16px;
}

.package-detail-actions {
  position: static;
  z-index: 20;
  bottom: 82px;
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 18px;
  padding: 12px;
  border-radius: 17px;
  background: rgba(255, 253, 249, 0.96);
  box-shadow: 0 15px 38px rgba(24, 51, 44, 0.14);
  backdrop-filter: blur(14px);
}

.package-detail-actions .primary-button {
  min-width: 260px;
}

.color-advice {
  margin-top: 16px;
  padding: 17px;
  border: 1px solid #dfe7e2;
  border-radius: 17px;
  background: linear-gradient(145deg, #eef4f0, #f9f8f2);
}

.color-advice__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.color-advice__head strong {
  display: block;
  color: #29443a;
  font-size: 15px;
}

.color-advice__head span {
  display: block;
  margin-top: 3px;
  color: var(--muted);
  font-size: 9px;
}

.color-advice__title {
  margin-top: 0 !important;
  color: var(--green) !important;
  font-size: 11px !important;
  font-weight: 800;
}

.color-advice > p {
  margin: 12px 0 0;
  color: #40544b;
  font-size: 12px;
  font-weight: 700;
}

.color-advice > small {
  display: block;
  margin-top: 5px;
  color: #748079;
  font-size: 10px;
  line-height: 1.6;
}

.palette-row {
  display: grid;
  gap: 7px;
  margin-top: 13px;
}

.palette-row button {
  padding: 10px 11px;
  border: 1px solid #d9e2dd;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.78);
  text-align: left;
}

.palette-row button span {
  display: block;
  color: #385248;
  font-size: 11px;
  font-weight: 800;
}

.palette-row button small {
  display: block;
  margin-top: 3px;
  color: #8a938f;
  font-size: 9px;
}

.service-hero {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 26px;
  border-radius: 25px;
  background:
    radial-gradient(circle at 86% 15%, rgba(190, 218, 201, 0.28), transparent 18rem),
    linear-gradient(145deg, #173e35, #245b4e);
}

.service-avatar {
  display: grid;
  width: 66px;
  height: 66px;
  flex: 0 0 auto;
  place-items: center;
  color: var(--green-dark);
  border-radius: 50%;
  background: #f2d29b;
  font-size: 26px;
  font-weight: 800;
}

.service-hero h2 {
  margin: 0;
  color: #fff;
  font-size: 23px;
}

.service-hero p {
  margin: 7px 0 0;
  color: rgba(255, 255, 255, 0.68);
  font-size: 11px;
  line-height: 1.65;
}

.service-online {
  margin-left: auto;
  padding: 7px 10px;
  color: #d9f4e6;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.08);
  font-size: 10px;
}

.service-grid {
  display: grid;
  gap: 17px;
  margin-top: 18px;
}

.service-form,
.service-info {
  padding: 22px;
}

.service-form h2,
.service-info h2 {
  margin: 0 0 10px;
}

.service-form > .primary-button {
  width: 100%;
  margin-top: 18px;
}

.faq-item {
  padding: 13px 0;
  border-bottom: 1px solid #eceeea;
}

.faq-item:last-child {
  border-bottom: 0;
}

.faq-item strong {
  font-size: 13px;
}

.faq-item p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.65;
}

.service-history {
  margin: 18px 5px 0;
  color: var(--muted);
  font-size: 11px;
}

.checkout-board.is-pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: 100%;
}

.checkout-board.is-pair > div {
  width: 100%;
}

.combo-order-note {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 12px;

}

  function buildPackageTierBeadIds(packageItem, tierId) {
    const tier = getPackageTier(tierId);
    const beadSize =
      tier.id === "light"
        ? Math.max(6, packageItem.beadSize - 2)
        : tier.id === "premium"
          ? Math.min(14, packageItem.beadSize + 2)
          : packageItem.beadSize;
    const target = getTargetCount(packageItem.productType, beadSize);
    const baseIds = Array.from(
      { length: target },
      (_, index) => packageItem.materialIds[index % packageItem.materialIds.length]
    );

    if (tier.id === "light") {
      return { ids: baseIds, beadSize, tier };
    }

    const pool = PACKAGE_UPGRADE_POOL[packageItem.id] || ["whiteJade", "metalSilver"];
    const replaceEvery = tier.id === "premium" ? 5 : 9;
    const upgradedIds = baseIds.map((id, index) =>
      index > 0 && index % replaceEvery === 0 ? pool[index % pool.length] : id
    );
    return { ids: upgradedIds, beadSize, tier };
  }

  function getParentChildChildIds(adultIds, theme, childSize) {

        return childSize <= 8 ? "goldenObsidian" : "oldSandalwood";

    if (theme === "natural") {
      return adultIds.map((id, index) => {
        if (index % 5 === 0) {
          return "greenJade";
        }
        if (index % 5 === 1) {
          return "celadonJade";
        }
        return index % 3 === 0 ? "oldSandalwood" : "goldenCamphor";
      });
    }

    return adultIds.map((id, index) => (index % 7 === 0 ? "whiteJade" : id));
  }

  function getColorAdvice(beadIds) {
    const items = beadIds.map(getMaterial).filter(Boolean);
    if (!items.length) {
      return {
        title: "从深色主珠开始",
        ratio: "建议 60% 主色 + 25% 过渡色 + 15% 亮点珠",
        text: "先选择木色或深色矿珠作为主色，再加入白玉或银曜石提亮。"
      };
    }

    const counts = items.reduce((result, item) => {
      result[item.category] = (result[item.category] || 0) + 1;
      return result;
    }, {});
    const total = items.length;
    const woodRatio = (counts.wood || 0) / total;
    const jadeRatio = (counts.jade || 0) / total;
    const stoneRatio = (counts.stone || 0) / total;
    const categoryCount = Object.keys(counts).length;

    if (woodRatio >= 0.68) {
      return {
        title: "暖木主调",
        ratio: "当前木色偏多，建议加入 1—3 颗白玉或金属隔珠",

        title: "清透玉色",

        text: "两侧加入深色珠会让玉色更亮，也更适合日常佩戴。"

      return {
        title: "冷色矿珠",
        ratio: "黑灰矿珠偏多，建议加入暖木或金色隔珠",
        text: "暖色点缀可以降低冷硬感，情侣或礼物款尤其适合。"

      return {
        title: "材质层次丰富",
        ratio: "颜色和材质较多，建议保留一个明确主色",
        text: "把主色控制在 60% 左右，其他颜色只做过渡和焦点。"
      };
    }

      title: "配色相对均衡",
      ratio: "主色 60% + 过渡色 25% + 亮点色 15%",
      text: "目前层次完整，可把最有特色的一颗珠子放在上方视觉中心。"
    };

  function resizeBeadIdsForProduct(productType, beadSize, preserveSizes) {
    const source = state.beadIds.length ? state.beadIds.slice() : TEMPLATES[0].materialIds.slice();
    const sourceSizes =
      preserveSizes && state.beadSizes.length
        ? state.beadSizes.slice()
        : createSizeArray(source.length, beadSize);
    const target = getTargetCount(productType, beadSize);
    state.beadIds = Array.from({ length: target }, (_, index) => source[index % source.length]);
    state.beadSizes = Array.from(
      { length: target },
      (_, index) => sourceSizes[index % sourceSizes.length] || beadSize
    );
  }

  function buildBracelet(beadIds, productType, beadSize, beadSizes) {
    const items = beadIds.map(getMaterial).filter(Boolean);
    const count = items.length;
    const type = productType || state.productType;
    const size = beadSize || state.beadSize;
    const sizes = beadSizes || createSizeArray(items.length, size);
    const isNecklace = type === "necklace";
    const isRing = type === "ring";

    return items.map((item, index) => {
      const angle = (-90 + (360 * index) / Math.max(count, 1)) * (Math.PI / 180);
      const radiusX = isRing ? 23 : isNecklace ? (count > 48 ? 45 : 43) : count > 24 ? 42 : 39;
      const radiusY = isRing ? 21 : isNecklace ? (count > 48 ? 41 : 39) : count > 24 ? 37 : 34;
      const left = 50 + radiusX * Math.cos(angle);
      const top = (isRing ? 50 : 51) + radiusY * Math.sin(angle);
      const itemSize = sizes[index] || size;
      const visualSize =
        itemSize === 6 ? 5.4 : itemSize === 8 ? 6.8 : itemSize === 10 ? 8.4 : itemSize === 12 ? 10.2 : 11.8;
      const shapeClass = item.shape === "square" ? "square" : item.shape === "hex" ? "hex" : "";

      return {
        ...item,
        uid: `${item.id}-${index}`,
        index,
        shapeClass,
        style: `left:${left.toFixed(2)}%;top:${top.toFixed(2)}%;width:${visualSize}%;height:${visualSize}%;margin-left:-${visualSize / 2}%;margin-top:-${visualSize / 2}%;${getMaterialStyle(item)}`
      };
    });
  }

  function calculateDesign(beadIds, productType, beadSize, beadSizes, lineMaterial) {
    const items = beadIds.map(getMaterial).filter(Boolean);
    const type = productType || state.productType;
    const size = beadSize || state.beadSize;
    const sizes = beadSizes || createSizeArray(items.length, size);
    const line = getLineMaterial(lineMaterial || state.lineMaterial);
    const materialTotal = items.reduce(
      (sum, item, index) => sum + getEffectivePrice(item, sizes[index] || size),
      0
    );
    const productDiscount = type === "necklace" ? 0.72 : type === "ring" ? 0.86 : 1;
    const totalPrice = Math.max(19, Math.round(materialTotal * productDiscount + line.price));
    const beadLengthMm = items.reduce((sum, item, index) => sum + (sizes[index] || size), 0);
    const connectorAllowanceMm = type === "necklace" ? (line.id === "steel" ? 180 : 150) : 0;
    const totalMm = beadLengthMm + connectorAllowanceMm;
    const circumference = (totalMm / 10).toFixed(1);
    const wristMin = Math.max(12.5, Number(circumference) - 1.3).toFixed(1);
    const wristMax = (Number(circumference) + 0.8).toFixed(1);
    const ringDiameter = (circumference / Math.PI).toFixed(1);
    const target = getTargetCount(type, size);
    const minimumCheckoutCount =
      type === "ring" ? 5 : type === "necklace" ? 12 : 8;
    const fit =
      type === "ring"
        ? { label: "适合指围", range: `${ringDiameter}cm左右` }
        : type === "necklace"
          ? { label: "适合颈围", range: `${wristMin}-${wristMax}cm` }
          : { label: "建议手围", range: `${wristMin}-${wristMax}cm` };

    return {
      productType: type,
      productName: getProductName(type),
      beadSize: size,
      lineMaterial: line,
      linePrice: line.price,
      target,
      count: items.length,
      totalPrice,
      circumference,
      wristRange: fit.range,
      fitLabel: fit.label,
      progress: Math.min(100, Math.round((items.length / target) * 100)),
      minimumCheckoutCount,
      canCheckout: items.length >= minimumCheckoutCount
    };
  }

  function summarizeMaterials(beadIds) {
    return beadIds.reduce((list, id) => {
      const found = list.find((item) => item.id === id);
      if (found) {
        found.count += 1;
      } else {
        const material = getMaterial(id);
        if (material) {
          list.push({ id, name: material.name, count: 1, style: getMaterialStyle(material) });
        }
      }
      return list;
    }, []);
  }

  function renderCheckout() {
    const checkout = state.checkout || createCheckout();
    const summary =
      checkout.summary ||
      calculateDesign(
        checkout.beadIds,
        checkout.productType,
        checkout.beadSize,
        checkout.beadSizes,
        checkout.lineMaterial
      );
    const shippingFee = 8;
    const giftFee = checkout.giftWrap ? 12 : 0;
    const total = summary.totalPrice + shippingFee + giftFee;
    const sizeChoices =
      checkout.productType === "ring"
        ? ["1.4", "1.5", "1.6", "1.7", "1.8", "1.9"]
        : checkout.productType === "necklace"
          ? ["40", "42", "44", "46", "48", "50"]
          : ["14", "15", "16", "17", "18", "19"];
    const sizeLabel =
      checkout.productType === "ring" ? "戒指直径" : checkout.productType === "necklace" ? "期望颈围" : "实际手围";
    checkout.total = total;
    const isCombo = Boolean(checkout.combo);
    const isParentCombo =
      checkout.combo && checkout.combo.packageId === "parentChild";
    const firstComboLabel = isParentCombo ? "成人款" : "第一款";
    const secondComboLabel = isParentCombo ? "儿童款" : "第二款";
    const previewMarkup = isCombo
      ? `
        <div class="checkout-board is-pair">
          <div>
            <div class="combo-preview-label">${firstComboLabel}</div>
            ${renderBoard(buildBracelet(checkout.combo.adult.beadIds, "bracelet", checkout.combo.adult.beadSize, checkout.combo.adult.beadSizes), "", "bracelet", checkout.combo.adult.lineMaterial)}
          </div>
          <div>
            <div class="combo-preview-label">${secondComboLabel}</div>
            ${renderBoard(buildBracelet(checkout.combo.child.beadIds, "bracelet", checkout.combo.child.beadSize, checkout.combo.child.beadSizes), "", "bracelet", checkout.combo.child.lineMaterial)}
          </div>
        </div>
      `
      : `<div class="checkout-board">${renderBoard(buildBracelet(checkout.beadIds, checkout.productType, checkout.beadSize, checkout.beadSizes), "", checkout.productType, checkout.lineMaterial)}</div>`;
    const sizeMarkup = isCombo
      ? `<div class="combo-order-note">
          <div><span>${firstComboLabel}手围</span><strong>${checkout.combo.adult.wrist}cm</strong></div>
          <div><span>${secondComboLabel}手围</span><strong>${checkout.combo.child.wrist}cm</strong></div>
          <div><span>组合优惠</span><strong class="price">-¥${checkout.combo.discount}</strong></div>

      : `<div class="field">
          <span class="field-label">${sizeLabel}</span>
          <div class="choice-row">
            ${sizeChoices

                (size) =>
                  `<button type="button" class="choice ${checkout.wrist === size ? "active" : ""}" data-action="set-wrist" data-value="${size}">${size}cm</button>`

    return `

        <div class="checkout-grid">

  function renderPackageDetail() {
    const packageItem = PACKAGES.find((item) => item.id === state.selectedPackageId);
    if (!packageItem) {
      state.view = "home";
      return renderHome();
    }

    const detail = PACKAGE_DETAILS[packageItem.id];
    const selectedTier = getPackageTierData(packageItem, state.selectedTierId);
    const isParentChild = packageItem.id === "parentChild";
    const isCouplePair = packageItem.id === "coupleMemory";
    const parentChildSize = Math.max(6, selectedTier.beadSize - 2);
    const childIds = isParentChild
      ? getParentChildChildIds(selectedTier.ids, state.packageDetail.parentTheme, parentChildSize)
      : [];
    const childSummary = isParentChild
      ? calculateDesign(
          childIds,
          "bracelet",
          parentChildSize,
          createSizeArray(childIds.length, parentChildSize),
          selectedTier.tier.lineMaterial
        )
      : null;
    const coupleSecondIds = isCouplePair
      ? getCoupleSecondIds(selectedTier.ids, state.packageDetail.coupleTheme)
      : [];
    const coupleSecondSummary = isCouplePair
      ? calculateDesign(
          coupleSecondIds,
          "bracelet",
          selectedTier.beadSize,
          createSizeArray(coupleSecondIds.length, selectedTier.beadSize),
          selectedTier.tier.lineMaterial
        )
      : null;
    const comboPrice = isParentChild
      ? Math.round((selectedTier.summary.totalPrice + childSummary.totalPrice) * 0.82)
      : isCouplePair
        ? Math.round((selectedTier.summary.totalPrice + coupleSecondSummary.totalPrice) * 0.92)
        : selectedTier.summary.totalPrice;

    return `
      <main class="page">
        <div class="back-row">
          <button class="icon-button" data-action="go-tab" data-tab="home">‹</button>
          <div>
            <div class="eyebrow" style="color:#8c958f;">PACKAGE RECOMMENDATION</div>

          </div>
        </div>

          <div>

  function formatRelativeTime(timestamp) {
    const minutes = Math.max(1, Math.round((Date.now() - timestamp) / 60000));
    if (minutes < 60) {
      return `${minutes}分钟前`;
    }
    const hours = Math.round(minutes / 60);
    if (hours < 24) {
      return `${hours}小时前`;
    }
    return `${Math.round(hours / 24)}天前`;
  }

  function createParentComboCheckout() {
    const packageItem = PACKAGES.find((item) => item.id === "parentChild");
    if (!packageItem) {
      return;
    }
    const tierData = getPackageTierData(packageItem, state.selectedTierId);
    const childSize = Math.max(6, tierData.beadSize - 2);
    const childIds = getParentChildChildIds(
      tierData.ids,
      state.packageDetail.parentTheme,
      childSize
    );
    const childSizes = createSizeArray(childIds.length, childSize);
    const childSummary = calculateDesign(
      childIds,
      "bracelet",
      childSize,
      childSizes,
      tierData.tier.lineMaterial
    );
    const adultTotal = tierData.summary.totalPrice;
    const childTotal = childSummary.totalPrice;
    const comboPrice = Math.round((adultTotal + childTotal) * 0.82);
    const summary = {
      ...tierData.summary,
      count: tierData.summary.count + childSummary.count,
      totalPrice: comboPrice,
      productName: "亲子双串",
      fitLabel: "成人/儿童手围",
      wristRange: `${state.packageDetail.adultWrist}/${state.packageDetail.childWrist}cm`,
      comboDiscount: adultTotal + childTotal - comboPrice
    };

    state.checkout = {
      designName: `${packageItem.name} · 一大一小`,
      productType: "bracelet",
      beadSize: tierData.beadSize,
      lineMaterial: tierData.tier.lineMaterial,
      beadIds: tierData.ids.slice(),
      beadSizes: createSizeArray(tierData.ids.length, tierData.beadSize),
      summary,
      wrist: state.packageDetail.adultWrist,
      giftWrap: true,
      total: comboPrice + 8,
      combo: {
        packageId: packageItem.id,
        tierId: state.selectedTierId,
        adult: {
          beadIds: tierData.ids.slice(),
          beadSizes: createSizeArray(tierData.ids.length, tierData.beadSize),
          beadSize: tierData.beadSize,
          summary: tierData.summary,
          wrist: state.packageDetail.adultWrist,
          lineMaterial: tierData.tier.lineMaterial
        },
        child: {
          beadIds: childIds,
          beadSizes: childSizes,
          beadSize: childSize,
          summary: childSummary,
          wrist: state.packageDetail.childWrist,
          lineMaterial: tierData.tier.lineMaterial
        },
        discount: summary.comboDiscount
      },
      form: {
        receiver: "",
        phone: "",
        address: "",
        engraving: "",
        remark: `亲子套餐：成人手围${state.packageDetail.adultWrist}cm，儿童手围${state.packageDetail.childWrist}cm`
      }
    };
    state.view = "checkout";
    render();
  }

  function createCoupleCheckout() {
    const packageItem = PACKAGES.find((item) => item.id === "coupleMemory");
    if (!packageItem) {
      return;
    }
    const tierData = getPackageTierData(packageItem, state.selectedTierId);
    const secondIds = getCoupleSecondIds(
      tierData.ids,
      state.packageDetail.coupleTheme
    );
    const secondSizes = createSizeArray(secondIds.length, tierData.beadSize);
    const secondSummary = calculateDesign(
      secondIds,
      "bracelet",
      tierData.beadSize,
      secondSizes,
      tierData.tier.lineMaterial
    );
    const firstTotal = tierData.summary.totalPrice;
    const secondTotal = secondSummary.totalPrice;
    const comboPrice = Math.round((firstTotal + secondTotal) * 0.92);
    const summary = {
      ...tierData.summary,
      count: tierData.summary.count + secondSummary.count,
      totalPrice: comboPrice,
      productName: "情侣双串",
      fitLabel: "两人手围",
      wristRange: `17/${state.packageDetail.partnerWrist}cm`,
      comboDiscount: firstTotal + secondTotal - comboPrice
    };

    state.checkout = {
      designName: `${packageItem.name} · 情侣双串`,
      productType: "bracelet",
      beadSize: tierData.beadSize,
      lineMaterial: tierData.tier.lineMaterial,
      beadIds: tierData.ids.slice(),
      beadSizes: createSizeArray(tierData.ids.length, tierData.beadSize),
      summary,
      wrist: "17",
      giftWrap: true,
      total: comboPrice + 8,
      combo: {
        packageId: packageItem.id,
        tierId: state.selectedTierId,
        adult: {
          beadIds: tierData.ids.slice(),
          beadSizes: createSizeArray(tierData.ids.length, tierData.beadSize),
          beadSize: tierData.beadSize,
          summary: tierData.summary,
          wrist: "17",
          lineMaterial: tierData.tier.lineMaterial
        },
        child: {
          beadIds: secondIds,
          beadSizes: secondSizes,
          beadSize: tierData.beadSize,
          summary: secondSummary,
          wrist: state.packageDetail.partnerWrist,
          lineMaterial: tierData.tier.lineMaterial
        },
        discount: summary.comboDiscount
      },
      form: {
        receiver: "",
        phone: "",
        address: "",
        engraving: "",
        remark: `情侣双串：第二只手围${state.packageDetail.partnerWrist}cm，可在此填写姓名或纪念日期`
      }
    };
    state.view = "checkout";
    render();
  }

  function addBead(id) {
    if (!getMaterial(id)) {
      return;
    }
    if (state.beadIds.length >= getMaxCount(state.productType)) {
      showToast(`最多选择 ${getMaxCount(state.productType)} 颗`);
      return;
    }
    state.beadIds.push(id);
    state.beadSizes.push(state.beadSize);
    state.designName = "自定义设计";
    render();
    if (sheet.classList.contains("open")) {
      closeSheet();
    }
  }

  function removeLast(id) {
    const index = state.beadIds.lastIndexOf(id);
    if (index < 0) {
      return;
    }
    state.beadIds.splice(index, 1);
    state.beadSizes.splice(index, 1);
    state.designName = "自定义设计";
    render();
  }

  function formatDate(timestamp) {
    const date = new Date(timestamp);
    return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")} ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
  }

  function submitOrder() {
    const checkout = state.checkout || createCheckout();
    const form = checkout.form;

    if (!form.receiver.trim()) {
      showToast("请填写收货人");
      return;
    }
    if (!/^1\d{10}$/.test(form.phone)) {
      showToast("请填写正确手机号");
      return;
    }
    if (!form.address.trim()) {
      showToast("请填写收货地址");
      return;
    }

    const order = {
      id: `MSG${Date.now()}`,
      status: "待付款",
      designName: checkout.designName,
      productType: checkout.productType,
      beadSize: checkout.beadSize,
      lineMaterial: checkout.lineMaterial,
      beadIds: checkout.beadIds.slice(),
      beadSizes: checkout.beadSizes.slice(),
      combo: checkout.combo || null,
      summary: checkout.summary,
      wrist: checkout.wrist,
      giftWrap: checkout.giftWrap,
      totalPrice: checkout.total,
      receiver: form.receiver.trim(),
      phone: form.phone,
      address: form.address.trim(),
      engraving: form.engraving.trim(),
      remark: form.remark.trim(),
      createdAt: Date.now()
    };

    state.orders.unshift(order);
    writeStore(STORAGE_KEYS.orders, state.orders);
    state.checkout = null;
    state.view = "orders";
    showToast("订单已创建到本地记录");
    render();
  }

  document.addEventListener("click", (event) => {
    const actionTarget = event.target.closest("[data-action]");
    if (!actionTarget) {
      return;
    }

    const action = actionTarget.dataset.action;
    const id = actionTarget.dataset.id;
    const index = Number(actionTarget.dataset.index);

    switch (action) {
      case "go-tab":
        state.view = actionTarget.dataset.tab;
        state.checkout = null;
        render();
        break;
      case "start-blank":
        state.beadIds = [];
        state.beadSizes = [];
        state.designName = "空白设计";
        state.view = "design";
        render();
        break;
      case "use-template": {
        const template = TEMPLATES.find((item) => item.id === id);
        if (template) {
          if (state.view === "home") {
            state.productType = "bracelet";
            state.beadSize = 12;
          }
          state.beadIds = template.materialIds.slice();
          state.beadSizes =
            template.beadSizes?.slice() ||
            createSizeArray(state.beadIds.length, state.beadSize);
          resizeBeadIdsForProduct(state.productType, state.beadSize, true);
          state.designName = template.name;
          state.view = "design";
          render();
        }
        break;
      }
      case "use-package": {
        const packageItem = PACKAGES.find((item) => item.id === id);
        if (packageItem) {
          state.productType = packageItem.productType;
          state.beadSize = packageItem.beadSize;
          state.lineMaterial = "elastic";
          state.beadIds = packageItem.materialIds.slice();
          state.beadSizes = createSizeArray(state.beadIds.length, state.beadSize);
          resizeBeadIdsForProduct(state.productType, state.beadSize, true);
          state.designName = packageItem.name;
          state.view = "design";
          render();
        }
        break;
      }
      case "open-package":
        state.selectedPackageId = id;
        state.selectedTierId = "recommended";
        state.packageDetail.corporateNote = "";
        state.view = "packageDetail";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        break;
      case "select-tier":
        if (PACKAGE_TIERS.some((item) => item.id === id)) {
          state.selectedTierId = id;
          render();
        }
        break;
      case "set-package-option": {
        const field = actionTarget.dataset.field;
        const value = actionTarget.dataset.value;
        if (field && value != null) {
          state.packageDetail[field] = value;
          render();
        }
        break;
      }
      case "use-tier": {
        const packageItem = PACKAGES.find(
          (item) => item.id === actionTarget.dataset.package
        );
        if (packageItem) {
          const tierData = getPackageTierData(
            packageItem,
            actionTarget.dataset.tier || state.selectedTierId
          );
          state.productType = packageItem.productType;
          state.beadSize = tierData.beadSize;
          state.lineMaterial = tierData.tier.lineMaterial;
          state.beadIds = tierData.ids.slice();
          state.beadSizes = createSizeArray(
            state.beadIds.length,
            state.beadSize
          );
          state.designName = `${packageItem.name} · ${tierData.tier.name}`;
          state.view = "design";
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
        break;
      }
      case "checkout-parent":
        createParentComboCheckout();
        break;
      case "checkout-couple":
        createCoupleCheckout();
        break;
      case "set-product":
        if (PRODUCT_TYPES.some((item) => item.id === id)) {
          state.productType = id;
          resizeBeadIdsForProduct(id, state.beadSize, true);
          render();
        }
        break;
      case "set-bead-size": {
        const nextSize = Number(actionTarget.dataset.value);
        if (BEAD_SIZES.includes(nextSize)) {
          state.beadSize = nextSize;
          render();
        }
        break;
      }
      case "set-line-material":
        if (STRING_MATERIALS.some((item) => item.id === id)) {
          state.lineMaterial = id;
          render();
        }
        break;
      case "apply-palette": {
        const palette = COLOR_PALETTES.find((item) => item.id === id);
        if (palette) {
          const target = getTargetCount(state.productType, state.beadSize);
          state.beadIds = Array.from(
            { length: target },
            (_, index) => palette.materialIds[index % palette.materialIds.length]
          );
          state.beadSizes = createSizeArray(target, state.beadSize);
          state.lineMaterial = palette.lineMaterial;
          state.designName = palette.name;
          render();
          showToast(`已套用${palette.name}`);
        }
        break;
      }
      case "set-category":
        state.category = id;
        render();
        break;
      case "set-inspiration":
        if (["all", "daily", "gift", "mixed"].includes(id)) {
          state.inspirationCategory = id;
          render();
        }
        break;
      case "set-knowledge-category":
        state.knowledgeCategory = id;
        render();
        break;
      case "add-bead":
        addBead(id);
        break;
      case "remove-bead":
        removeLast(id);
        break;
      case "remove-at":
        if (index >= 0 && index < state.beadIds.length) {
          state.beadIds.splice(index, 1);
          state.beadSizes.splice(index, 1);
          state.designName = "自定义设计";
          render();
        }
        break;
      case "undo":
        if (state.beadIds.length) {
          state.beadIds.pop();
          state.beadSizes.pop();
          state.designName = "自定义设计";
          render();
        }
        break;
      case "clear-design":
        if (window.confirm("确定清空当前设计吗？")) {
          state.beadIds = [];
          state.beadSizes = [];
          state.designName = "空白设计";
          render();
        }
        break;
      case "show-material":
        state.selectedMaterialId = id;
        renderSheet();
        break;
      case "open-material-detail":
        openMaterialDetail(id);
        break;
      case "add-from-sheet":
        addBead(id);
        break;
      case "add-from-detail": {
        const detailId = id;
        closeSheet();
        state.view = "design";
        addBead(detailId);
        break;
      }
      case "open-publish":
        openPublishSheet();
        break;
      case "confirm-publish": {
        if (!state.publishDraft || !state.beadIds.length) {
          return;
        }
        const post = {
          id: `post-${Date.now()}`,
          designer: state.publishDraft.nickname.trim() || "匿名木友",
          note: state.publishDraft.note.trim() || "分享一份独一无二的木珠搭配。",
          beadIds: state.beadIds.slice(),
          beadSizes: state.beadSizes.slice(),
          productType: state.productType,
          beadSize: state.beadSize,
          lineMaterial: state.lineMaterial,
          likes: 0,
          liked: false,
          createdAt: Date.now()
        };
        state.communityPosts.unshift(post);
        writeStore(STORAGE_KEYS.community, state.communityPosts);
        state.publishDraft = null;
        closeSheet();
        state.view = "community";
        render();
        showToast("已发布到拾光社区");
        break;
      }
      case "close-sheet":
        closeSheet();
        break;
      case "save-design": {
        if (!state.beadIds.length) {
          showToast("先选择珠子");
          return;
        }
        const design = {
          id: `design-${Date.now()}`,
          name: state.designName,
          productType: state.productType,
          beadSize: state.beadSize,
          lineMaterial: state.lineMaterial,
          beadIds: state.beadIds.slice(),
          beadSizes: state.beadSizes.slice(),
          summary: calculateDesign(
            state.beadIds,
            state.productType,
            state.beadSize,
            state.beadSizes,
            state.lineMaterial
          ),
          createdAt: Date.now()
        };
        state.designs.unshift(design);
        state.designs = state.designs.slice(0, 30);
        writeStore(STORAGE_KEYS.designs, state.designs);
        showToast("设计已保存");
        break;
      }
      case "use-design": {
        const design = state.designs.find((item) => item.id === id);
        if (design) {
          state.beadIds = design.beadIds.slice();
          state.designName = design.name;
          state.productType = design.productType || "bracelet";
          state.beadSize = design.beadSize || 12;
          state.lineMaterial = design.lineMaterial || "elastic";
          state.beadSizes =
            design.beadSizes || createSizeArray(state.beadIds.length, state.beadSize);
          state.view = "design";
          render();
        }
        break;
      }
      case "delete-design":
        state.designs = state.designs.filter((item) => item.id !== id);
        writeStore(STORAGE_KEYS.designs, state.designs);
        render();
        break;
      case "checkout":
        createCheckout();
        state.view = "checkout";
        render();
        break;
      case "back-design":
        state.view = "design";
        render();
        break;
      case "set-wrist":
        if (state.checkout) {
          state.checkout.wrist = actionTarget.dataset.value;
          render();
        }
        break;
      case "submit-order":
        submitOrder();
        break;
      case "open-orders":
        state.view = "orders";
        render();
        break;
      case "open-knowledge":
        state.view = "knowledge";
        render();
        break;
      case "open-service":
        state.serviceForm.type = actionTarget.dataset.context
          ? "团体礼品"
          : state.serviceForm.type;
        state.serviceForm.message = actionTarget.dataset.context
          ? `咨询内容：${actionTarget.dataset.context}；团体备注：${state.packageDetail.corporateNote || "待补充"}`
          : state.serviceForm.message;
        state.view = "service";
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
        break;
      case "set-service-type":
        state.serviceForm.type = actionTarget.dataset.value;
        render();
        break;
      case "submit-service": {
        const form = state.serviceForm;
        if (!form.name.trim() || !form.phone.trim() || !form.message.trim()) {
          showToast("请填写称呼、联系方式和具体需求");
          return;
        }
        state.serviceInquiries.unshift({
          id: `service-${Date.now()}`,
          ...form,
          createdAt: Date.now()
        });
        writeStore(STORAGE_KEYS.service, state.serviceInquiries);
        state.serviceForm = {
          name: "",
          phone: "",
          type: form.type,
          message: ""
        };
        render();
        showToast("咨询已提交");
        break;
      }
      case "like-post": {
        const post = state.communityPosts.find((item) => item.id === id);
        if (post) {
          post.liked = !post.liked;
          post.likes = Math.max(0, Number(post.likes || 0) + (post.liked ? 1 : -1));
          writeStore(STORAGE_KEYS.community, state.communityPosts);
          render();
        }
        break;
      }
      case "use-post": {
        const post = state.communityPosts.find((item) => item.id === id);
        if (post) {
          state.productType = post.productType || "bracelet";
          state.beadSize = post.beadSize || 12;
          state.lineMaterial = post.lineMaterial || "elastic";
          state.beadIds = post.beadIds.slice();
          state.beadSizes =
            post.beadSizes || createSizeArray(state.beadIds.length, state.beadSize);
          state.designName = `${post.designer || "木友"}的设计`;
          state.view = "design";
          render();
        }
        break;
      }
      case "mark-paid": {
        const order = state.orders.find((item) => item.id === id);
        if (order) {
          order.status = "制作中";
          writeStore(STORAGE_KEYS.orders, state.orders);
          render();
          showToast("已模拟支付");
        }
        break;
      }
      case "cancel-order":
        if (window.confirm("确定取消这笔订单吗？")) {
          state.orders = state.orders.filter((item) => item.id !== id);
          writeStore(STORAGE_KEYS.orders, state.orders);
          render();
        }
        break;
      case "view-order": {
        const order = state.orders.find((item) => item.id === id);
        if (order) {
          window.alert(
            `${order.designName}\n${order.summary.count}颗，手围${order.wrist}cm\n收货人：${order.receiver}\n地址：${order.address}`
          );
        }
        break;
      }
      case "clear-data":
        if (window.confirm("将删除全部本地设计、订单和社区发布，确定继续吗？")) {
          state.designs = [];
          state.orders = [];
          state.communityPosts = createSeedPosts();
          state.serviceInquiries = [];
          writeStore(STORAGE_KEYS.designs, []);
          writeStore(STORAGE_KEYS.orders, []);
          writeStore(STORAGE_KEYS.community, state.communityPosts);
          writeStore(STORAGE_KEYS.service, []);
          render();
          showToast("本地记录已清除");
        }
        break;
      default:
        break;
    }
  });

  document.addEventListener("input", (event) => {
    const packageField = event.target.dataset.packageField;
    if (packageField) {
      state.packageDetail[packageField] = event.target.value;
      return;
    }

    const serviceField = event.target.dataset.serviceField;
    if (serviceField) {
      state.serviceForm[serviceField] = event.target.value;
      return;
    }

    const publishField = event.target.dataset.publishField;
    if (publishField && state.publishDraft) {
      state.publishDraft[publishField] = event.target.value;
      return;
    }

    const field = event.target.dataset.field;
    if (!field || !state.checkout) {
      return;
    }
    state.checkout.form[field] = event.target.value;
  });

  document.addEventListener("change", (event) => {
    if (event.target.id !== "gift-wrap" || !state.checkout) {
      return;
    }
    state.checkout.giftWrap = event.target.checked;
    render();
  });

  sheet.addEventListener("click", (event) => {
    if (event.target === sheet) {
      closeSheet();
    }
  });

  render();
})();

    </script>
  </body>
</html>
